<body>

    <template id="article-template">

    <script>
        // ===== CONSTANTS - USING ONLY YOUR PROVIDED SOURCES =====
        const DEFAULT_SOURCES = [
            { id: 'healthcare-it-today', name: 'Healthcare IT Today', url: 'https://www.healthcareittoday.com/feed/', homepage: 'https://www.healthcareittoday.com/', category: 'Health IT & AI', enabled: true },
            { id: 'nejm-ai-podcast', name: 'NEJM AI Podcast', url: 'https://ai-podcast.nejm.org/feed.xml', homepage: 'https://ai-podcast.nejm.org/', category: 'Clinical AI', enabled: true },
            { id: 'bmj-digital-health', name: 'BMJ Digital Health', url: 'https://bmjdigitalhealth.bmj.com/rss/current.xml', homepage: 'https://bmjdigitalhealth.bmj.com/', category: 'Medical AI', enabled: true },
            { id: 'healthtech-magazines', name: 'Healthtech Magazines', url: 'https://www.healthtechmagazines.com/feed/', homepage: 'https://www.healthtechmagazines.com/', category: 'Health Tech', enabled: true },
            { id: 'ai-news', name: 'Artificial Intelligence News', url: 'https://www.artificialintelligence-news.com/feed/', homepage: 'https://www.artificialintelligence-news.com/', category: 'General AI', enabled: true },
            { id: 'intelligent-health', name: 'Intelligent Health AI', url: 'https://blog.intelligenthealth.ai/rss.xml', homepage: 'https://blog.intelligenthealth.ai/', category: 'Health AI', enabled: true },
            { id: 'ai-and-health', name: 'AI and Health', url: 'https://www.aiandhealth.com/blog-feed.xml', homepage: 'https://www.aiandhealth.com/', category: 'Health AI', enabled: true },
            { id: 'bayesian-health', name: 'Bayesian Health', url: 'https://www.bayesianhealth.com/feed/', homepage: 'https://www.bayesianhealth.com/', category: 'Clinical AI', enabled: true }
        ];

        // ===== AI/HEALTH KEYWORDS FOR FILTERING =====
        const AI_HEALTH_KEYWORDS = [
            // AI Terms
            'AI', 'artificial intelligence', 'machine learning', 'deep learning', 'neural network',
            'algorithm', 'predictive analytics', 'computer vision', 'natural language processing', 'NLP',
            'large language model', 'LLM', 'generative AI', 'GPT', 'chatbot', 'robotics', 'automation',
            'data science', 'big data', 'analytics', 'intelligent system', 'smart system',
            
            // Healthcare/Medical Terms
            'healthcare', 'medical', 'medicine', 'clinical', 'patient', 'doctor', 'physician', 'hospital',
            'diagnosis', 'diagnostic', 'treatment', 'therapy', 'surgery', 'pharmaceutical', 'drug',
            'vaccine', 'epidemiology', 'public health', 'telemedicine', 'telehealth', 'digital health',
            'mhealth', 'ehealth', 'health tech', 'medtech', 'biotech', 'genomics', 'precision medicine',
            
            // Specific Health AI Applications
            'medical imaging', 'radiology', 'pathology', 'oncology', 'cardiology', 'neurology',
            'mental health', 'psychiatry', 'dermatology', 'ophthalmology', 'dentistry', 'orthopedics',
            'pediatrics', 'geriatrics', 'emergency medicine', 'intensive care', 'ICU',
            'wearable', 'sensor', 'monitoring', 'remote patient', 'virtual care',
            'clinical decision', 'diagnostic aid', 'treatment planning', 'drug discovery',
            'clinical trial', 'research', 'study', 'trial', 'evidence', 'outcome',
            
            // Technology in Healthcare
            'electronic health record', 'EHR', 'EMR', 'health information', 'HIT', 'health IT',
            'medical device', 'FDA approval', 'regulatory', 'compliance', 'HIPAA',
            'cybersecurity', 'privacy', 'security', 'blockchain', 'IoT', 'internet of things',
            
            // Companies/Organizations
            'Google Health', 'DeepMind', 'IBM Watson', 'Microsoft Healthcare', 'Amazon Care',
            'Apple Health', 'Samsung Health', 'Philips', 'GE Healthcare', 'Siemens Healthineers',
            'Medtronic', 'Johnson & Johnson', 'Pfizer', 'Moderna', 'Novartis', 'Roche',
            'Mayo Clinic', 'Cleveland Clinic', 'Johns Hopkins', 'Mass General', 'Stanford Medicine'
        ];

        // ===== STATE MANAGEMENT =====
        let state = {
            currentView: 'feed',
            currentSource: 'all',
            sources: JSON.parse(JSON.stringify(DEFAULT_SOURCES)),
            articles: [],
            nejmArticles: [],
            bookmarks: new Set(),
            vaultFilters: {
                search: '',
                date: 'newest'
            },
            lastRefresh: null,
            isLoading: false
        };

        // ===== INITIALIZATION =====
        function init() {
            loadState();
            setupEventListeners();
            setupFocusAreaVisibility();
            renderNavigation();
            renderSources();
            loadArticles();
        }

        function loadState() {
            try {
                const savedBookmarks = localStorage.getItem('544_health_ai_bookmarks');
                const savedView = localStorage.getItem('544_health_ai_view');
                
                if (savedBookmarks) {
                    const bookmarkArray = JSON.parse(savedBookmarks);
                    state.bookmarks = new Set(bookmarkArray);
                }
                
                if (savedView) {
                    switchView(savedView, false);
                }
            } catch (e) {
                console.warn('Failed to load saved state:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('544_health_ai_bookmarks', JSON.stringify([...state.bookmarks]));
                localStorage.setItem('544_health_ai_view', state.currentView);
            } catch (e) {
                console.warn('Failed to save state:', e);
            }
        }

        // ===== SETUP FOCUS AREA VISIBILITY =====
        function setupFocusAreaVisibility() {
            const focusSection = document.getElementById('focus-area-section');
            if (focusSection) {
                if (state.currentView === 'feed') {
                    focusSection.classList.remove('hidden');
                } else {
                    focusSection.classList.add('hidden');
                }
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const view = item.dataset.view;
                    if (view) {
                        switchView(view);
                    }
                });
            });

            // Source filtering
            document.addEventListener('click', (e) => {
                if (e.target.closest('.source-item')) {
                    const sourceItem = e.target.closest('.source-item');
                    const sourceId = sourceItem.dataset.source;
                    if (sourceId) {
                        setCurrentSource(sourceId);
                    }
                }
            });

            // Refresh button
            document.getElementById('refresh-btn').addEventListener('click', loadArticles);

            // Search
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', debounce(() => {
                handleSearch(searchInput.value);
            }, 300));

            // Date filter
            document.getElementById('date-filter').addEventListener('change', (e) => {
                state.vaultFilters.date = e.target.value;
                if (state.currentView === 'feed') {
                    renderArticles();
                } else if (state.currentView === 'vault') {
                    renderVault();
                }
            });
        }

        // ===== VIEW MANAGEMENT =====
        function switchView(view, updateNav = true) {
            // Hide all views
            document.querySelectorAll('.view-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show selected view
            const viewElement = document.getElementById(`${view}-view`);
            if (viewElement) {
                viewElement.classList.add('active');
            }
            
            state.currentView = view;
            
            // Update navigation
            if (updateNav) {
                renderNavigation();
            }
            
            // Update focus area visibility
            setupFocusAreaVisibility();
            
            // Update feed title based on view
            updateFeedTitle();
            
            // Render content based on view
            if (view === 'feed') {
                renderArticles();
            } else if (view === 'nejm') {
                renderNEJMArticles();
            } else if (view === 'vault') {
                renderVault();
            }
            
            saveState();
        }

        function renderNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                const view = item.dataset.view;
                if (view) {
                    if (view === state.currentView) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                }
            });
        }

        // ===== SOURCE MANAGEMENT =====
        function renderSources() {
            const sourceList = document.getElementById('source-list');
            if (!sourceList) return;
            
            sourceList.innerHTML = '';
            
            // Show only AI Live Feed sources (excluding NEJM since it has its own tab)
            const feedSources = state.sources.filter(source => source.id !== 'nejm-ai-podcast');
            
            feedSources.forEach(source => {
                if (source.enabled) {
                    const sourceItem = document.createElement('button');
                    sourceItem.className = 'nav-item source-item';
                    sourceItem.dataset.source = source.id;
                    
                    sourceItem.innerHTML = `
                        <div class="nav-item-content">
                            <span class="source-dot"></span>
                            <span class="source-name">${source.name}</span>
                        </div>
                    `;
                    
                    sourceList.appendChild(sourceItem);
                }
            });
            
            // Update active source
            updateActiveSource();
        }

        function setCurrentSource(sourceId) {
            state.currentSource = sourceId;
            updateActiveSource();
            renderArticles();
        }

        function updateActiveSource() {
            // Update "All Topics" button
            const allTopicsBtn = document.getElementById('all-topics-btn');
            if (allTopicsBtn) {
                if (state.currentSource === 'all') {
                    allTopicsBtn.classList.add('active');
                } else {
                    allTopicsBtn.classList.remove('active');
                }
            }
            
            // Update source items
            document.querySelectorAll('.source-item').forEach(item => {
                const sourceId = item.dataset.source;
                if (sourceId === state.currentSource) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // ===== AI/HEALTH FILTER FUNCTION =====
        function isAIHealthRelated(text) {
            if (!text || typeof text !== 'string') return false;
            
            const searchText = text.toLowerCase();
            
            // Check for AI/health keywords
            for (const keyword of AI_HEALTH_KEYWORDS) {
                if (searchText.includes(keyword.toLowerCase())) {
                    return true;
                }
            }
            
            // Check for AI-related patterns
            const aiPatterns = [
                /AI[\-\s]?(powered|driven|based|assisted|enabled)/i,
                /machine[\-\s]?learning/i,
                /deep[\-\s]?learning/i,
                /neural[\-\s]?network/i,
                /artificial[\-\s]?intelligence/i,
                /predictive[\-\s]?(model|analytics|analysis)/i,
                /computer[\-\s]?vision/i,
                /natural[\-\s]?language[\-\s]?processing/i,
                /large[\-\s]?language[\-\s]?model/i,
                /generative[\-\s]?AI/i,
                /clinical[\-\s]?decision[\-\s]?support/i,
                /digital[\-\s]?(health|medicine|therapeutics)/i,
                /tele(health|medicine)/i,
                /mhealth|ehealth/i,
                /health[\-\s]?tech|med[\-\s]?tech/i,
                /precision[\-\s]?medicine/i,
                /personalized[\-\s]?(medicine|treatment|therapy)/i
            ];
            
            for (const pattern of aiPatterns) {
                if (pattern.test(searchText)) {
                    return true;
                }
            }
            
            return false;
        }

        // ===== FIXED BOOKMARK FUNCTION =====
        function toggleBookmark(articleId, bookmarkBtn) {
            const wasBookmarked = state.bookmarks.has(articleId);
            
            if (wasBookmarked) {
                // REMOVE from bookmarks
                state.bookmarks.delete(articleId);
                bookmarkBtn.classList.remove('active');
                bookmarkBtn.innerHTML = '<i class="far fa-bookmark"></i>';
                
                // Also remove from Vault display if we're in Vault view
                if (state.currentView === 'vault') {
                    const articleEl = document.querySelector(`#vault-grid .article-card[data-id="${articleId}"]`);
                    if (articleEl) {
                        articleEl.remove();
                    }
                }
            } else {
                // ADD to bookmarks
                state.bookmarks.add(articleId);
                bookmarkBtn.classList.add('active');
                bookmarkBtn.innerHTML = '<i class="fas fa-bookmark"></i>';
            }
            
            // Update articles in state
            state.articles = state.articles.map(article => 
                article.id === articleId ? { ...article, bookmarked: !wasBookmarked } : article
            );
            
            state.nejmArticles = state.nejmArticles.map(article => 
                article.id === articleId ? { ...article, bookmarked: !wasBookmarked } : article
            );
            
            // Update unread count in sidebar
            const unread = state.articles.filter(a => !state.bookmarks.has(a.id)).length;
            document.getElementById('unread-count').textContent = unread > 99 ? '99+' : unread;
            
            saveState();
            
            // Refresh Vault view if we're in it
            if (state.currentView === 'vault') {
                renderVault();
            }
        }

        // ===== FIXED VAULT RENDER FUNCTION =====
        function renderVault() {
            const grid = document.getElementById('vault-grid');
            const loading = document.getElementById('vault-loading');
            const empty = document.getElementById('vault-empty');
            
            loading.classList.add('hidden');
            
            // Get ALL articles from both feeds that are ACTUALLY bookmarked
            let vaultArticles = [];
            
            // Check real articles from feed
            state.articles.forEach(article => {
                if (state.bookmarks.has(article.id)) {
                    vaultArticles.push(article);
                }
            });
            
            // Check NEJM articles
            state.nejmArticles.forEach(article => {
                if (state.bookmarks.has(article.id)) {
                    vaultArticles.push(article);
                }
            });
            
            // Apply filters
            const filters = state.vaultFilters;
            if (filters.search) {
                vaultArticles = vaultArticles.filter(article => 
                    article.title.toLowerCase().includes(filters.search) || 
                    article.summary.toLowerCase().includes(filters.search)
                );
            }
            
            // Apply date filter
            vaultArticles = applyDateFilter(vaultArticles, filters.date);
            
            if (vaultArticles.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';
            
            // Render vault articles
            vaultArticles.forEach(article => {
                const template = document.getElementById('vault-article-template');
                const clone = template.content.cloneNode(true);
                const articleCard = clone.querySelector('.article-card');
                
                articleCard.dataset.id = article.id;
                
                // Fill in article data
                articleCard.querySelector('.article-source').textContent = article.source || 'Unknown Source';
                articleCard.querySelector('.article-title a').textContent = article.title;
                articleCard.querySelector('.article-title a').href = article.url || '#';
                articleCard.querySelector('.date-text').textContent = article.date || 'Unknown date';
                articleCard.querySelector('.author-text').textContent = article.author || 'Unknown author';
                articleCard.querySelector('.article-summary').textContent = article.summary || '';
                
                // Set read full button
                articleCard.querySelector('.read-full-btn').href = article.url || '#';
                
                // Handle tags
                const tagsContainer = articleCard.querySelector('.article-tags');
                if (article.tags && article.tags.length > 0) {
                    article.tags.forEach(tag => {
                        const tagSpan = document.createElement('span');
                        tagSpan.textContent = tag;
                        tagsContainer.appendChild(tagSpan);
                    });
                }
                
                // Set up delete button
                const deleteBtn = articleCard.querySelector('.vault-delete-btn');
                deleteBtn.addEventListener('click', () => {
                    // Remove from bookmarks
                    state.bookmarks.delete(article.id);
                    saveState();
                    
                    // Remove from display
                    articleCard.remove();
                    
                    // Update unread count
                    const unread = state.articles.filter(a => !state.bookmarks.has(a.id)).length;
                    document.getElementById('unread-count').textContent = unread > 99 ? '99+' : unread;
                    
                    // Show empty state if no more articles
                    if (grid.children.length === 0) {
                        grid.classList.add('hidden');
                        empty.classList.remove('hidden');
                    }
                });
                
                // Set up bookmark button
                const bookmarkBtn = articleCard.querySelector('.bookmark-btn');
                bookmarkBtn.addEventListener('click', () => {
                    toggleBookmark(article.id, bookmarkBtn);
                });
                
                grid.appendChild(articleCard);
            });
        }

        // ===== ARTICLE RENDERING =====
        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            
            loading.classList.add('hidden');
            
            let filteredArticles = [...state.articles];
            
            // Filter by source
            if (state.currentSource !== 'all') {
                filteredArticles = filteredArticles.filter(article => article.sourceId === state.currentSource);
            }
            
            // Filter by search
            const searchInput = document.getElementById('search-input');
            if (searchInput.value.trim()) {
                const searchTerm = searchInput.value.toLowerCase().trim();
                filteredArticles = filteredArticles.filter(article => 
                    article.title.toLowerCase().includes(searchTerm) || 
                    article.summary.toLowerCase().includes(searchTerm) ||
                    (article.tags && article.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
                );
            }
            
            // Apply date filter
            filteredArticles = applyDateFilter(filteredArticles, state.vaultFilters.date);
            
            if (filteredArticles.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';
            
            // Render articles
            filteredArticles.forEach(article => {
                renderArticle(article, grid);
            });
        }

        function renderNEJMArticles() {
            const grid = document.getElementById('nejm-grid');
            const loading = document.getElementById('nejm-loading');
            const empty = document.getElementById('nejm-empty');
            
            loading.classList.add('hidden');
            
            if (state.nejmArticles.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';
            
            state.nejmArticles.forEach(article => {
                renderArticle(article, grid);
            });
        }

        function renderArticle(article, container) {
            const template = document.getElementById('article-template');
            const clone = template.content.cloneNode(true);
            const articleCard = clone.querySelector('.article-card');
            
            articleCard.dataset.id = article.id;
            
            // Fill in article data
            articleCard.querySelector('.article-source').textContent = article.source || 'Unknown Source';
            articleCard.querySelector('.article-title a').textContent = article.title;
            articleCard.querySelector('.article-title a').href = article.url || '#';
            articleCard.querySelector('.date-text').textContent = article.date || 'Unknown date';
            articleCard.querySelector('.author-text').textContent = article.author || 'Unknown author';
            articleCard.querySelector('.article-summary').textContent = article.summary || '';
            
            // Set bookmark state
            const bookmarkBtn = articleCard.querySelector('.bookmark-btn');
            if (state.bookmarks.has(article.id)) {
                bookmarkBtn.classList.add('active');
                bookmarkBtn.innerHTML = '<i class="fas fa-bookmark"></i>';
            }
            
            // Set read full button
            articleCard.querySelector('.read-full-btn').href = article.url || '#';
            
            // Handle tags
            const tagsContainer = articleCard.querySelector('.article-tags');
            if (article.tags && article.tags.length > 0) {
                article.tags.forEach(tag => {
                    const tagSpan = document.createElement('span');
                    tagSpan.textContent = tag;
                    tagsContainer.appendChild(tagSpan);
                });
            }
            
            // Set up event listeners
            bookmarkBtn.addEventListener('click', () => {
                toggleBookmark(article.id, bookmarkBtn);
            });
            
            // Set up AI insight button
            const aiBtn = articleCard.querySelector('.ai-insight-btn');
            aiBtn.addEventListener('click', () => {
                getAIInsight(article.id, articleCard);
            });
            
            container.appendChild(articleCard);
        }

        // ===== HELPER FUNCTIONS =====
        function updateFeedTitle() {
            const titleElement = document.getElementById('feed-title');
            const subtitleElement = document.getElementById('feed-subtitle');
            
            if (!titleElement || !subtitleElement) return;
            
            switch(state.currentView) {
                case 'analysis':
                    titleElement.textContent = '544 Analysis Hub';
                    subtitleElement.textContent = 'Upload and manage your curated analysis and feedback on selected topics.';
                    break;
                case 'nejm':
                    titleElement.textContent = 'NEJM AI Insights';
                    subtitleElement.textContent = 'Curated AI research and discussions from the New England Journal of Medicine.';
                    break;
                case 'vault':
                    titleElement.textContent = 'Vault';
                    subtitleElement.textContent = 'Your saved articles and research. Click the trash icon to remove items.';
                    break;
                case 'feed':
                    titleElement.textContent = '544 Health AI Tracker';
                    subtitleElement.textContent = 'Monitoring specialized AI developments across Healthcare & Pharma.';
                    break;
            }
        }

        function applyDateFilter(articles, filter) {
            const now = new Date();
            
            switch(filter) {
                case 'newest':
                    return [...articles].sort((a, b) => new Date(b.date) - new Date(a.date));
                case 'oldest':
                    return [...articles].sort((a, b) => new Date(a.date) - new Date(b.date));
                case 'lastweek':
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return articles.filter(article => new Date(article.date) >= weekAgo)
                                  .sort((a, b) => new Date(b.date) - new Date(a.date));
                case 'lastmonth':
                    const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    return articles.filter(article => new Date(article.date) >= monthAgo)
                                  .sort((a, b) => new Date(b.date) - new Date(a.date));
                default:
                    return articles;
            }
        }

        function handleSearch(searchTerm) {
            state.vaultFilters.search = searchTerm.toLowerCase().trim();
            
            if (state.currentView === 'feed') {
                renderArticles();
            } else if (state.currentView === 'vault') {
                renderVault();
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ===== ACTUAL RSS/XML FETCHING WITH AI/HEALTH FILTERING =====
        async function loadArticles() {
            if (state.isLoading) return;
            
            state.isLoading = true;
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.disabled = true;
            refreshBtn.querySelector('i').classList.add('fa-spin');
            
            try {
                // Clear existing articles
                state.articles = [];
                state.nejmArticles = [];
                
                // Fetch from ALL sources in parallel
                const fetchPromises = state.sources.map(source => fetchRSSFeed(source));
                const results = await Promise.allSettled(fetchPromises);
                
                // Process results
                results.forEach((result, index) => {
                    if (result.status === 'fulfilled' && result.value) {
                        const source = state.sources[index];
                        const articles = result.value;
                        
                        if (source.id === 'nejm-ai-podcast') {
                            // NEJM articles go to NEJM tab (all are AI/health related)
                            state.nejmArticles = [...state.nejmArticles, ...articles];
                        } else {
                            // Filter for AI/health articles for AI Live Feed
                            const aiHealthArticles = articles.filter(article => 
                                isAIHealthRelated(article.title) || 
                                isAIHealthRelated(article.summary) ||
                                (article.tags && article.tags.some(tag => isAIHealthRelated(tag)))
                            );
                            
                            state.articles = [...state.articles, ...aiHealthArticles];
                            
                            // Log filtering stats
                            console.log(`${source.name}: ${articles.length} total, ${aiHealthArticles.length} AI/health related`);
                        }
                    } else {
                        console.warn(`Failed to fetch from ${state.sources[index].name}:`, result.reason);
                    }
                });
                
                // Update unread count
                const unread = state.articles.filter(a => !state.bookmarks.has(a.id)).length;
                document.getElementById('unread-count').textContent = unread > 99 ? '99+' : unread;
                
                // Render based on current view
                if (state.currentView === 'feed') {
                    renderArticles();
                } else if (state.currentView === 'nejm') {
                    renderNEJMArticles();
                } else if (state.currentView === 'vault') {
                    renderVault();
                }
                
                state.lastRefresh = new Date();
                console.log(`Loaded ${state.articles.length} AI/health articles from AI Live Feed sources`);

        // ===== ACTUAL RSS PARSING =====
        async function fetchRSSFeed(source) {
            try {
                console.log(`Fetching RSS from: ${source.url}`);
                
                // Use CORS proxy to avoid CORS issues
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const response = await fetch(`${proxyUrl}${encodeURIComponent(source.url)}`, {
                    headers: {
                        'Accept': 'application/rss+xml, application/xml, text/xml, application/atom+xml'
                    },
                    timeout: 10000 // 10 second timeout
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                // Check for parsing errors
                const parserError = xmlDoc.querySelector('parsererror');
                if (parserError) {
                    console.error(`XML parsing error for ${source.name}:`, parserError.textContent);
                    return getFallbackArticles(source);
                }
                
                // Try different RSS/Atom formats
                let items = xmlDoc.querySelectorAll('item, entry');
                
                // If no items found, try different selectors
                if (items.length === 0) {
                    items = xmlDoc.querySelectorAll('channel > item, feed > entry');
                }
                
                console.log(`Found ${items.length} items in ${source.name}`);
                
                const articles = [];
                const maxItems = 15; // Get up to 15 items, will filter later
                
                for (let i = 0; i < Math.min(items.length, maxItems); i++) {
                    const item = items[i];
                    
                    try {
                        // Extract title
                        let title = item.querySelector('title')?.textContent || 
                                   item.querySelector('title')?.textContent || 
                                   'No title available';
                        
                        // Clean up title
                        title = title.replace(/<[^>]*>/g, '').trim();
                        if (!title || title === 'No title available') continue;
                        
                        // Extract link/URL
                        let url = item.querySelector('link')?.textContent || 
                                 item.querySelector('link')?.getAttribute('href') ||
                                 item.querySelector('guid')?.textContent ||
                                 source.homepage;
                        
                        // Handle relative URLs
                        if (url && !url.startsWith('http')) {
                            url = new URL(url, source.homepage).href;
                        }
                        
                        // Extract description/summary
                        let summary = item.querySelector('description')?.textContent ||
                                     item.querySelector('summary')?.textContent ||
                                     item.querySelector('content\\:encoded')?.textContent ||
                                     item.querySelector('content')?.textContent ||
                                     '';
                        
                        // Clean up summary
                        summary = summary.replace(/<[^>]*>/g, '').trim();
                        if (summary.length > 300) {
                            summary = summary.substring(0, 300) + '...';
                        }
                        
                        // Extract date
                        let dateText = item.querySelector('pubDate')?.textContent ||
                                      item.querySelector('published')?.textContent ||
                                      item.querySelector('date')?.textContent ||
                                      item.querySelector('dc\\:date')?.textContent ||
                                      new Date().toISOString();
                        
                        // Format date
                        const date = new Date(dateText);
                        const formattedDate = isNaN(date.getTime()) ? 
                            new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) :
                            date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                        
                        // Extract author
                        let author = item.querySelector('author')?.textContent ||
                                    item.querySelector('dc\\:creator')?.textContent ||
                                    item.querySelector('creator')?.textContent ||
                                    source.name;
                        
                        // Clean author name
                        author = author.replace(/<[^>]*>/g, '').trim();
                        
                        // Extract categories/tags
                        const categories = Array.from(item.querySelectorAll('category')).map(cat => 
                            cat.textContent.trim()
                        ).filter(cat => cat.length > 0);
                        
                        // Add source category as a tag
                        const allTags = [...categories, source.category];
                        
                        // Generate unique ID
                        const id = `${source.id}-${Date.now()}-${i}-${Math.random().toString(36).substr(2, 9)}`;
                        
                        articles.push({
                            id: id,
                            title: title,
                            summary: summary,
                            source: source.name,
                            sourceId: source.id,
                            date: formattedDate,
                            author: author,
                            url: url,
                            tags: allTags
                        });
                        
                    } catch (itemError) {
                        console.warn(`Error parsing item ${i} from ${source.name}:`, itemError);
                        continue;
                    }
                }
                
                return articles;
                
            } catch (error) {
                console.error(`Error fetching RSS from ${source.name}:`, error);
                // Fallback to mock data if RSS fetch fails
                return getFallbackArticles(source);
            }
        }

        async function getAIInsight(articleId, articleCard) {
            const aiBtn = articleCard.querySelector('.ai-insight-btn');
            const aiInsight = articleCard.querySelector('.ai-insight');
            const aiText = articleCard.querySelector('.ai-text');
            
            aiBtn.disabled = true;
            aiBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>Analyzing...';
            
            setTimeout(() => {
                const article = [...state.articles, ...state.nejmArticles].find(a => a.id === articleId);
                
                if (!article) {
                    aiText.textContent = "Unable to analyze this article. Please try again.";
                    aiInsight.classList.remove('hidden');
                    aiBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i>AI Insight';
                    aiBtn.disabled = false;
                    return;
                }
                
                // Generate AI insight based on article content
                let insight = "";
                const title = article.title.toLowerCase();
                const summary = article.summary.toLowerCase();
                
                if (title.includes('diagnostic') || summary.includes('diagnosis') || summary.includes('detect')) {
                    insight = "This diagnostic AI technology could significantly reduce diagnostic delays and improve accuracy. Implementation considerations include integration with existing clinical workflows, validation across diverse patient populations, and addressing potential algorithmic bias in different demographic groups.";
                } else if (title.includes('treatment') || summary.includes('therapy') || summary.includes('management')) {
                    insight = "AI-driven treatment approaches show promise for personalized medicine. Key factors for success include robust clinical evidence, physician acceptance, patient engagement strategies, and integration with electronic health records for seamless clinical decision support.";
                } else if (title.includes('monitoring') || summary.includes('surveillance') || summary.includes('tracking')) {
                    insight = "Continuous AI monitoring represents a shift toward proactive healthcare. Important considerations include data privacy safeguards, alert fatigue management, clinical validation of monitoring algorithms, and ensuring equitable access across different healthcare settings.";
                } else if (title.includes('drug') || summary.includes('pharmaceutical') || summary.includes('medication')) {
                    insight = "AI in pharmaceutical development could accelerate discovery timelines. Critical success factors include validation of AI-predicted compounds, regulatory pathway clarity, integration with traditional research methods, and addressing intellectual property considerations for AI-generated discoveries.";
                } else if (title.includes('surgery') || summary.includes('surgical') || summary.includes('operation')) {
                    insight = "AI-assisted surgical technologies enhance precision and outcomes. Implementation challenges include surgeon training requirements, integration with existing surgical systems, liability considerations, and demonstrating clear clinical benefits over traditional approaches.";
                } else {
                    insight = "This healthcare AI advancement shows potential for improving clinical outcomes. Successful adoption requires addressing data quality issues, ensuring regulatory compliance, providing adequate clinician training, maintaining transparency in AI decision-making processes, and demonstrating clear value in terms of patient outcomes and healthcare efficiency.";
                }
                
                aiText.textContent = insight;
                aiInsight.classList.remove('hidden');
                aiBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i>AI Insight';
                aiBtn.disabled = false;
            }, 1500);
        }
